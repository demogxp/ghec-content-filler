# Migration discovery fixtures only; this workflow never performs a migration.
# Documentation reviewed 2026-09-08:
# https://docs.github.com/en/migrations/using-github-enterprise-importer/migrating-between-github-products/about-migrations-between-github-products
# API reference: https://docs.github.com/en/rest (version 2026-03-10).
#
# Required bootstrap secret: DEMO_ADMIN_TOKEN, authorized for this disposable org.
# Recommended: an org-owner classic PAT with repo, admin:org,
# admin:repo_hook, admin:org_hook, project, security_events.
# Authorize SAML SSO; comply with org PAT approval/IP/expiration policies.
# No write:packages scope is needed: GHCR publishing uses GITHUB_TOKEN.
# Fine-grained PAT / pre-minted GitHub App installation token alternative:
# repository write: Administration, Contents, Issues,
# Webhooks, Pages, Environments, Secrets, Variables, Dependabot secrets,
# Codespaces secrets, Custom properties; read: Dependabot alerts.
# organization write: Administration, Members, Webhooks, Projects, Secrets,
# Variables, Custom properties, Codespaces secrets, Self-hosted runners.
# Scope access to this repository AND the optional demo companion/fork repositories.
# Endpoint/token-type support differs (notably Projects and Codespaces); failures
# are reported. An installation token must remain valid for the job duration.
# No App private key is created or stored. No human identity is impersonated.
#
# Effects outside demo-named objects: enables repository issues/wiki/discussions,
# sets PR merge options, enables Actions PR creation/approval for this repository,
# adds a topic, configures Pages only if no site exists,
# optionally enables security features, and adds ONLY prefixed files to the
# default branch for dependency discovery; creates .github/dependabot.yml only if
# absent (canonical name required by GitHub; existing configuration is preserved).
# Visibility/default branch are preserved.
# include_org_settings changes the org base permission to 'none' (affects members
# across ALL repositories). Other org policy settings are preserved. No invitations,
# paid runners, external webhooks, real credentials, or external forks are created.
# Demo namespace is reserved for this workflow. Secrets/variables use MIGRATION_DEMO_
# because GitHub disallows hyphens in their names. Org resource names include repo ID.
# Wiki initialization and the org default branch name may need the web UI.
# Review the coverage artifact/summary after each run; CREATED includes reused data.

name: Seed migration discovery demo
on:
  workflow_dispatch:
    inputs:
      confirm_demo_environment:
        description: "Type YES-SEED-DEMO-DATA (disposable organization only)"
        required: true
        type: string
      seed_level:
        description: Dataset size
        type: choice
        options: [full, minimal]
        default: full
      include_security_alerts:
        description: Enable available security products and submit harmless fixtures
        type: boolean
        default: true
      include_packages:
        description: Publish a tiny organization-owned container package
        type: boolean
        default: true
      include_org_settings:
        description: Set organization base permission to none (all repositories)
        type: boolean
        default: true

# Concurrency groups serialize this repository's runs. Repo-ID suffixes isolate
# generated organization resources from other repositories' seed workflows.
concurrency:
  group: migration-demo-${{ github.repository_owner }}
  cancel-in-progress: false

permissions: {}

jobs:
  seed:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write
      pull-requests: write
      discussions: write
      statuses: write
      deployments: write
      actions: read
      packages: write
      pages: write
      security-events: write
    env:
      DEMO_OWNER: ${{ github.repository_owner }}
      DEMO_REPO: ${{ github.event.repository.name }}
      DEMO_FULL_REPO: ${{ github.repository }}
      DEMO_CONFIRM: ${{ inputs.confirm_demo_environment }}
      DEMO_LEVEL: ${{ inputs.seed_level }}
      DEMO_SECURITY: ${{ inputs.include_security_alerts }}
      DEMO_PACKAGES: ${{ inputs.include_packages }}
      DEMO_ORG_SETTINGS: ${{ inputs.include_org_settings }}
      GH_PROMPT_DISABLED: '1'
      GH_NO_UPDATE_NOTIFIER: '1'
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: Require intentional execution in an organization
        env:
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DEMO_CONFIRM" != YES-SEED-DEMO-DATA || "$OWNER_TYPE" != Organization ]]; then
            echo '::error::Requires YES-SEED-DEMO-DATA and an organization-owned repository.'
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/migration-demo"
          printf 'DEMO_DIR=%s/migration-demo\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      # No checkout: no code, hooks, dependencies, or Dockerfiles from the target
      # repository are executed with bootstrap privileges.
      - name: Write self-contained seeder
        shell: bash
        run: |
          set -euo pipefail
          cat > "$DEMO_DIR/seed.py" <<'PY'
          import base64
          import gzip
          import hashlib
          import html
          import json
          import os
          from pathlib import Path
          import re
          import secrets
          import subprocess
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          ROOT = Path(os.environ['DEMO_DIR'])
          OWNER, REPO = os.environ['DEMO_OWNER'], os.environ['DEMO_REPO']
          FULL = os.environ['DEMO_FULL_REPO']
          API = os.environ['GITHUB_API_URL'].rstrip('/')
          SERVER = os.environ['GITHUB_SERVER_URL'].rstrip('/')
          GRAPHQL = os.environ['GITHUB_GRAPHQL_URL']
          P = 'migration-demo-'
          R = f'/repos/{FULL}'
          O = f'/orgs/{OWNER}'
          FULL_SEED = os.environ['DEMO_LEVEL'] == 'full'
          TOKEN = os.environ.get('GH_TOKEN', '')
          ADMIN = os.environ.get('DEMO_ADMIN_TOKEN', '')
          MASKS = [x for x in (TOKEN, ADMIN) if x]
          ROWS = {}
          REQUIRED_FAILURES = []
          # Inventory is the union of both source tables, both exclusion lists,
          # organization migration, branch exceptions, and data in limit notes.
          # Keys split compound documentation bullets so partial success is visible.
          INVENTORY = {
              'git': 'Git source / commit history', 'refs': 'Branches / tags / Git references',
              'prs': 'Pull requests', 'issues': 'Issues', 'milestones': 'Milestones',
              'wiki': 'Wikis', 'wiki_attachments': 'Wiki attachments',
              'workflows': 'Actions workflow definitions', 'actions_settings': 'Actions repository permissions',
              'commit_comments': 'Commit comments',
              'repo_hooks': 'Repository webhooks (active)', 'org_hooks': 'Organization webhooks',
              'topics': 'Repository topics', 'settings': 'Repository settings / visibility',
              'protection': 'Branch protections', 'pages': 'Pages settings / content',
              'autolinks': 'Autolink references', 'pr_settings': 'Pull request settings',
              'delete_head': 'Automatic head-branch deletion', 'auto_merge': 'Auto-merge setting',
              'merge': 'Merge commits / message settings', 'squash': 'Squash merge / message settings',
              'rebase_setting': 'Rebase merge setting', 'releases': 'Releases',
              'assets': 'Release assets / binary metadata', 'attachments': 'Issue / PR attachments',
              'history': 'User history / attribution', 'audit': 'Audit logs',
              'sarif': 'Code scanning results', 'codespaces': 'Codespaces repository secrets',
              'org_codespaces': 'Codespaces organization secrets', 'statuses': 'Commit status checks',
              'dependabot': 'Dependabot alerts', 'dependabot_secrets': 'Dependabot secrets',
              'discussions': 'Repository discussions', 'issue_edits': 'Issue-comment edit history',
              'pr_edits': 'PR-comment edit history', 'forks': 'Fork relationships',
              'repo_secrets': 'Actions repository secrets', 'org_secrets': 'Actions organization secrets',
              'repo_vars': 'Actions repository variables', 'org_vars': 'Actions organization variables',
              'environments': 'Environments', 'env_protection': 'Environment protection',
              'env_secrets': 'Environment secrets / variables', 'runners': 'Self-hosted runners',
              'large_runners': 'Larger runners', 'runner_groups': 'Runner-group configuration', 'artifacts': 'Workflow artifacts',
              'runs': 'Workflow run history', 'apps': 'GitHub Apps', 'installations': 'App installations',
              'lfs': 'LFS objects / large binaries', 'comment_links': 'Links to comments / events',
              'rebase_links': 'Commit links for rebase-merged PRs', 'mentions': 'User / team / org mentions',
              'packages': 'Organization-owned GitHub Packages', 'projects': 'Projects (current experience)',
              'reciprocal': 'Reciprocal mention links', 'cross_refs': 'Cross-repository issue / PR references',
              'secret_remediation': 'Secret scanning remediation states', 'personal_repos': 'User-owned repositories',
              'activity': 'Repository activity feed', 'properties': 'Repository custom-property values',
              'property_definitions': 'Organization property definitions', 'stars': 'Repository stars',
              'watchers': 'Repository watchers', 'rulesets': 'Repository rulesets',
              'org_rulesets': 'Organization rulesets', 'subissues': 'Sub-issues',
              'tag_protection': 'Legacy tag protection', 'access': 'User repository access',
              'collaborators': 'Repository collaborators',
              'profiles': 'User profiles', 'ssh': 'User SSH keys', 'signing': 'User signing keys',
              'pats': 'User personal access tokens', 'hook_secrets': 'Webhook secrets',
              'teams': 'Teams', 'team_access': 'Team repository access', 'team_members': 'Team membership',
              'repositories': 'Organization repositories', 'member_privileges': 'Member privileges / defaults',
              'default_branch': 'Organization default branch name', 'codeowners': 'CODEOWNERS team references',
              'bypass': 'PR bypass actors', 'last_push': 'Most-recent-push approval',
              'required_deploy': 'Required successful deployments', 'lock': 'Locked branch',
              'restrict_create': 'Restricted matching-branch creation', 'force': 'Force pushes allowed',
              'exceptions': 'Branch protection actor exceptions', 'force_actors': 'Selected force-push actors',
              'labels': 'Labels', 'comments': 'Issue comments', 'pr_comments': 'PR comments / reviews',
              'security_config': 'Repository security configuration', 'secret_config': 'Secret scanning configuration',
              'dependabot_config': 'Dependabot / dependency graph configuration',
              'deployments': 'Deployments', 'metadata': 'Repository metadata',
              'search': 'Code search index', 'mannequins': 'Migration mannequins',
          }

          def clean(value):
              text = str(value)
              for value in MASKS:
                  text = text.replace(value, '[REDACTED]')
              return text

          def save():
              temp = ROOT / 'coverage.tmp'
              temp.write_text(json.dumps(ROWS, indent=2), encoding='utf-8')
              temp.replace(ROOT / 'coverage.json')

          def record(keys, status, resource='', mechanism='', notes=''):
              for key in keys.split():
                  assert key in INVENTORY, key
                  ROWS[key] = dict(item=INVENTORY[key], status=status, resource=clean(resource),
                                   mechanism=mechanism, notes=clean(notes)[:1800])
              save()

          class APIError(Exception):
              def __init__(self, method, path, status, message):
                  self.status = status
                  super().__init__(f'{method} {path}: HTTP {status}: {clean(message)}')

          # Never forward authorization to a redirect target; upload URLs are checked.
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          OPENER = urllib.request.build_opener(NoRedirect)
          RESPONSE_LINK = ''
          LAST_WRITE = 0.0

          def api(path, method='GET', data=None, admin=False, missing=False, raw=None):
              global RESPONSE_LINK, LAST_WRITE
              token = ADMIN if admin else TOKEN
              if not token:
                  raise APIError(method, path, 401, 'DEMO_ADMIN_TOKEN missing' if admin else 'GITHUB_TOKEN missing')
              url = path if path.startswith('https://') else API + path
              host = urllib.parse.urlparse(url).hostname
              api_host = urllib.parse.urlparse(API).hostname
              allowed = {api_host, api_host.replace('api.', 'uploads.', 1)}
              if host not in allowed:
                  raise RuntimeError('Refused credential forwarding to unexpected host')
              body = raw if raw is not None else (json.dumps(data).encode() if data is not None else None)
              headers = {'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + token,
                         'X-GitHub-Api-Version': '2026-03-10', 'User-Agent': 'migration-demo-seeder',
                         'Content-Type': 'application/octet-stream' if raw is not None else 'application/json'}
              # Retry only reads and idempotent PUTs. Ambiguous POSTs must be
              # reconciled by the next run's lookup, not blindly duplicated.
              for attempt in range(4):
                  try:
                      if method != 'GET':
                          # GitHub recommends >=1 second between mutative requests.
                          time.sleep(max(0, 1.0 - (time.monotonic() - LAST_WRITE)))
                          LAST_WRITE = time.monotonic()
                      with OPENER.open(urllib.request.Request(url, data=body, headers=headers, method=method), timeout=45) as response:
                          RESPONSE_LINK = response.headers.get('Link', '')
                          payload = response.read()
                          return json.loads(payload) if payload else {}
                  except urllib.error.HTTPError as error:
                      payload = error.read().decode('utf-8', 'replace')
                      if error.code == 404 and missing:
                          return None
                      retryable = error.code in (429, 500, 502, 503, 504) or (
                          error.code == 403 and ('rate limit' in payload.lower() or error.headers.get('Retry-After')))
                      if retryable and method in ('GET', 'PUT') and attempt < 3:
                          delay = min(60, max(2 ** (attempt + 1), int(error.headers.get('Retry-After', '0'))))
                          time.sleep(delay)
                          continue
                      raise APIError(method, path, error.code, payload[:1200]) from None

          def listing(path, admin=False, key=None):
              result = []
              next_path = path + ('&' if '?' in path else '?') + 'per_page=100'
              for _ in range(1000):
                  value = api(next_path, admin=admin)
                  batch = value[key] if key else value
                  if not isinstance(batch, list):
                      raise RuntimeError('Unexpected pagination shape for ' + path)
                  result.extend(batch)
                  next_link = re.search(r'<([^>]+)>;\s*rel="next"', RESPONSE_LINK)
                  if not next_link:
                      return result
                  next_path = next_link.group(1)
              raise RuntimeError('Pagination bound exceeded; refusing incomplete lookup')

          def graphql(query, variables, admin=True):
              value = api(GRAPHQL, 'POST', {'query': query, 'variables': variables}, admin=admin)
              if value.get('errors'):
                  raise RuntimeError('GraphQL: ' + clean(json.dumps(value['errors']))[:1200])
              return value['data']

          def run(keys, mechanism, function, required=False, enabled=True):
              if not enabled:
                  record(keys, 'SKIPPED', mechanism=mechanism, notes='Disabled by workflow input / minimal seed.')
                  return None
              try:
                  print('Seeding ' + keys + ' ...', flush=True)
                  result = function()
                  for key in keys.split():
                      if ROWS[key]['status'] == 'NOT ATTEMPTED':
                          record(key, 'CREATED', str(result or FULL), mechanism, 'Created or reused after lookup.')
                  return result
              except Exception as error:
                  status = 'FAILED (REQUIRED)' if required else 'FAILED (OPTIONAL)'
                  if not required and isinstance(error, APIError) and error.status in (403, 404):
                      status = 'REQUIRES ENTERPRISE/ORG FEATURE OR LICENSE'
                  # Preserve individually successful rows when the rest of a group fails.
                  for key in keys.split():
                      if ROWS[key]['status'] == 'NOT ATTEMPTED':
                          record(key, status, mechanism=mechanism, notes=str(error))
                  print(clean(f'{keys}: {status}: {error}'))
                  if required:
                      REQUIRED_FAILURES.append(keys)
                  return None

          def command(args, *, cwd=None, admin=False, stdin=None, timeout=180):
              env = dict(os.environ)
              env['GH_TOKEN'] = ADMIN if admin else TOKEN
              env['GH_ENTERPRISE_TOKEN'] = env['GH_TOKEN']
              # Subprocesses receive only the credential they actually need.
              env.pop('DEMO_ADMIN_TOKEN', None)
              env['GH_HOST'] = urllib.parse.urlparse(SERVER).hostname
              env['GIT_ASKPASS'] = str(ROOT / 'askpass.sh')
              env['GIT_CONFIG_GLOBAL'] = '/dev/null'
              env['GIT_CONFIG_NOSYSTEM'] = '1'
              result = subprocess.run(args, cwd=cwd, env=env, input=stdin,
                                      capture_output=True, text=True, timeout=timeout)
              if result.returncode:
                  # stdout may contain credentials with some CLIs; never dump it.
                  raise RuntimeError(args[0] + ' failed: ' + clean(result.stderr[-1400:]))
              return result.stdout.strip()

          def by_name(path, field, name, data, *, admin=False, update='PATCH', id_field='id'):
              existing = next((x for x in listing(path, admin) if x.get(field) == name), None)
              if existing:
                  return api(f"{path.split('?')[0]}/{existing[id_field]}", update, data, admin=admin) if update else existing
              return api(path.split('?')[0], 'POST', data, admin=admin)

          def branch(name, sha, admin=False):
              assert name.startswith(P)
              value = api(R + '/git/ref/heads/' + name, admin=admin, missing=True)
              return value or api(R + '/git/refs', 'POST', {'ref': 'refs/heads/' + name, 'sha': sha}, admin=admin)

          def put_files(name, files, message, admin=False):
              assert name.startswith(P) or name == DEFAULT
              ref = api(R + '/git/ref/heads/' + urllib.parse.quote(name, safe=''), admin=admin)
              head = ref['object']['sha']
              changes = []
              for path, content in files.items():
                  # A filename/path segment is prefixed. No existing non-demo file is changed.
                  assert any(part.startswith(P) for part in path.split('/')), path
                  old = api(R + '/contents/' + path + '?ref=' + urllib.parse.quote(name, safe=''), admin=admin, missing=True)
                  if old and old.get('encoding') == 'base64' and base64.b64decode(old['content']).decode() == content:
                      continue
                  changes.append({'path': path, 'mode': '100644', 'type': 'blob', 'content': content})
              if not changes:
                  return head
              commit = api(R + '/git/commits/' + head, admin=admin)
              tree = api(R + '/git/trees', 'POST', {'base_tree': commit['tree']['sha'], 'tree': changes}, admin=admin)
              new = api(R + '/git/commits', 'POST', {'message': message, 'tree': tree['sha'], 'parents': [head]}, admin=admin)
              api(R + '/git/refs/heads/' + urllib.parse.quote(name, safe=''), 'PATCH', {'sha': new['sha'], 'force': False}, admin=admin)
              return new['sha']

          def issue_comment(number, suffix, body):
              marker = f'<!-- {P}{suffix} -->'
              path = R + f'/issues/{number}/comments'
              old = next((x for x in listing(path) if (x.get('body') or '').startswith(marker)), None)
              final = marker + '\n' + body
              if old:
                  if old['body'] != final:
                      return api(R + f"/issues/comments/{old['id']}", 'PATCH', {'body': final})
                  return old
              # Two versions, only on initial creation, produce bounded edit history.
              new = api(path, 'POST', {'body': marker + '\nInitial demo comment.'})
              return api(R + f"/issues/comments/{new['id']}", 'PATCH', {'body': final})

          def seed_core():
              label_names = []
              for suffix, color in [('bug', 'd73a4a'), ('enhancement', 'a2eeef'), ('triage', 'fbca04')]:
                  name = P + suffix
                  old = api(R + '/labels/' + name, missing=True)
                  api(R + ('/labels/' + name if old else '/labels'), 'PATCH' if old else 'POST',
                      {'name': name, 'color': color, 'description': 'Disposable discovery fixture'})
                  label_names.append(name)
              record('labels', 'CREATED', ', '.join(label_names), 'REST labels')
              milestone = by_name(R + '/milestones?state=all', 'title', P + 'milestone',
                                  {'title': P + 'milestone', 'description': 'Discovery acceptance', 'state': 'open'}, id_field='number')
              record('milestones', 'CREATED', milestone['html_url'], 'REST milestones')
              issues = []
              all_issues = listing(R + '/issues?state=all')
              for index, suffix in enumerate(['tracking', 'bug-report', 'completed']):
                  title = P + suffix
                  old = next((x for x in all_issues if x['title'] == title and 'pull_request' not in x), None)
                  body = 'Harmless disposable migration discovery fixture.'
                  if issues:
                      body += f"\nRelated to #{issues[0]['number']}."
                  payload = {'title': title, 'body': body, 'labels': [label_names[index]], 'milestone': milestone['number']}
                  value = api(R + (f"/issues/{old['number']}" if old else '/issues'), 'PATCH' if old else 'POST', payload)
                  desired = 'closed' if index == 2 else 'open'
                  if value['state'] != desired:
                      value = api(R + f"/issues/{value['number']}", 'PATCH', {'state': desired})
                  issues.append(value)
              record('issues', 'CREATED', ', '.join('#' + str(x['number']) for x in issues), 'REST issues', 'Two open; one closed; milestone and label associations.')
              comment = issue_comment(issues[0]['number'], 'issue-comment', f"Edited discovery comment; see #{issues[1]['number']}.")
              record('comments issue_edits', 'CREATED', comment['html_url'], 'POST then PATCH issue comment', 'Initial and edited versions; reruns reuse the comment.')
              issue_comment(issues[1]['number'], 'comment-link', 'Link to a specific comment: ' + comment['html_url'])
              record('comment_links', 'CREATED', comment['html_url'], 'Issue comment permalink')
              record('reciprocal', 'TRIGGERED/GENERATED INDIRECTLY', FULL, 'GitHub reference processing', 'Issue references trigger timeline backlinks; no fabricated events.')
              return issues

          def seed_git():
              base = P + 'base'
              branch(base, INFO_SHA)
              put_files(base, {P + 'content/README.md': '# Migration discovery demo\nHarmless fixture data.\n'}, P + 'initial content')
              sha = put_files(base, {P + 'content/example.txt': 'First line\nSecond line\n'}, P + 'second commit')
              branch(P + 'feature', sha)
              feature = put_files(P + 'feature', {P + 'content/example.txt': 'First line\nSecond line\nFeature line\n'}, P + 'feature commit')
              for suffix in ('protected', 'locked', 'rebase-base'):
                  branch(P + suffix, sha)
              tag = P + 'v1.0.0'
              if not api(R + '/git/ref/tags/' + tag, missing=True):
                  obj = api(R + '/git/tags', 'POST', {'tag': tag, 'message': 'Discovery annotated tag', 'object': sha, 'type': 'commit'})
                  api(R + '/git/refs', 'POST', {'ref': 'refs/tags/' + tag, 'sha': obj['sha']})
              record('git refs', 'CREATED', base + ', ' + P + 'feature, ' + tag, 'Git database REST API', 'Several real commits; existing demo refs are reused without force-pushing.')
              return sha, feature

          def seed_prs():
              title = P + 'feature'
              existing = next((x for x in listing(R + '/pulls?state=all') if x['title'] == title and x['head']['ref'] == P + 'feature'), None)
              pr = existing or api(R + '/pulls', 'POST', {'title': title, 'head': P + 'feature', 'base': P + 'base',
                  'body': f"References #{ISSUES[0]['number']}. Demo review metadata.", 'draft': False})
              record('prs', 'CREATED', pr['html_url'], 'REST pull requests', 'Org policy must allow Actions to create PRs; no automatic elevated fallback.')
              comment = issue_comment(pr['number'], 'pr-comment', f"Edited PR comment; references #{ISSUES[1]['number']}.")
              record('pr_edits', 'CREATED', comment['html_url'], 'POST/PATCH PR issue comment')
              return pr

          def reviews():
              body = P + 'review: harmless COMMENT review (not approval).'
              old = next((x for x in listing(R + f"/pulls/{PR['number']}/reviews") if x.get('body') == body), None)
              review = old or api(R + f"/pulls/{PR['number']}/reviews", 'POST', {'body': body, 'event': 'COMMENT',
                  'commit_id': FEATURE_SHA, 'comments': [{'path': P + 'content/example.txt', 'line': 3, 'side': 'RIGHT',
                                                       'body': P + 'inline: inspect this harmless addition.'}]})
              return review.get('html_url', PR['html_url'])

          def subissues():
              path = R + f"/issues/{ISSUES[0]['number']}/sub_issues"
              if not any(x['id'] == ISSUES[1]['id'] for x in listing(path)):
                  api(path, 'POST', {'sub_issue_id': ISSUES[1]['id']})
              return ISSUES[0]['html_url']

          def commit_metadata():
              body = P + 'commit-comment: discoverable fixture.'
              path = R + '/commits/' + BASE_SHA + '/comments'
              if not any(x['body'] == body for x in listing(path)):
                  api(path, 'POST', {'body': body})
              record('commit_comments', 'CREATED', BASE_SHA, 'REST commit comments')
              path = R + '/commits/' + FEATURE_SHA + '/statuses'
              if not any(x['context'] == P + 'check' and x['state'] == 'success' for x in listing(path)):
                  api(R + '/statuses/' + FEATURE_SHA, 'POST', {'state': 'success', 'context': P + 'check', 'description': 'Harmless demo status'})
              record('statuses', 'CREATED', FEATURE_SHA, 'REST commit statuses', 'Stable context; reruns do not append duplicate successes.')

          def rebase_pr():
              head, base = P + 'rebase-feature', P + 'rebase-base'
              old = next((x for x in listing(R + '/pulls?state=all') if x['title'] == P + 'rebase-example'), None)
              if old and old.get('merged_at'):
                  return old['html_url']
              branch(head, BASE_SHA)
              put_files(head, {P + 'content/rebased.txt': 'Rebase example\n'}, P + 'rebase fixture')
              pr = old or api(R + '/pulls', 'POST', {'title': P + 'rebase-example', 'head': head, 'base': base,
                  'body': f"Rebase-only fixture. References #{ISSUES[0]['number']}."})
              result = api(R + f"/pulls/{pr['number']}/merge", 'PUT', {'merge_method': 'rebase'})
              if not result.get('merged'):
                  raise RuntimeError('Rebase merge was not confirmed: ' + str(result))
              return pr['html_url']
