                  current = api(R + '/code-security-configuration', admin=True, missing=True)
                  if current and current.get('configuration', {}).get('id') == value['id']:
                      record('security_config', 'CONFIGURED', name, 'Code security configuration / selected repository attachment', 'Applies only to containing repository; may consume licensed security seats.')
                      return
                  time.sleep(5)
              record('security_config', 'TRIGGERED/GENERATED INDIRECTLY', name, 'Security configuration attach API', 'Attachment accepted; association not yet confirmed.')

          def secret_scanning():
              value = api(R, 'PATCH', {'security_and_analysis': {'secret_scanning': {'status': 'enabled'},
                         'secret_scanning_push_protection': {'status': 'enabled'}}}, admin=True)
              state = value.get('security_and_analysis', {})
              if state.get('secret_scanning', {}).get('status') != 'enabled':
                  raise RuntimeError('Secret scanning enablement was not confirmed')
              record('secret_config', 'CONFIGURED', FULL, 'PATCH repository security_and_analysis',
                     'No credential-shaped test string is committed. Push protection remains enabled.')

          def dependency_fixture():
              # Manifest-only old dependency: never installed/imported/executed.
              # A subdirectory manifest on the DEFAULT branch permits graph ingestion.
              files = {
                  P + 'dependencies/requirements.txt': 'Django==2.2.0\n',
                  P + 'dependencies/README.md': '# Discovery only\nNever install these intentionally outdated manifest entries.\n',
                  '.github/' + P + 'dependabot.yml': 'version: 2\nupdates:\n  - package-ecosystem: pip\n    directory: /migration-demo-dependencies\n    schedule:\n      interval: monthly\n    open-pull-requests-limit: 0\n',
              }
              sha = put_files(DEFAULT, files, P + 'dependency discovery fixture')
              config_path = R + '/contents/.github/dependabot.yml'
              canonical = api(config_path + '?ref=' + urllib.parse.quote(DEFAULT, safe=''), missing=True)
              if not canonical:
                  api(config_path, 'PUT', {'message': P + 'Dependabot configuration', 'branch': DEFAULT,
                      'content': base64.b64encode(files['.github/' + P + 'dependabot.yml'].encode()).decode()})
              api(R + '/vulnerability-alerts', 'PUT', admin=True)
              record('dependabot_config', 'CONFIGURED', P + 'dependencies/requirements.txt', 'Default-branch manifest + vulnerability-alerts API',
                     'Alerts enabled; canonical Dependabot config ' + ('already exists and was preserved.' if canonical else 'created for demo directory with zero version-update PRs.') +
                     ' Dependency graph ingestion may be asynchronous; no dependency is installed.')
              alerts = listing(R + '/dependabot/alerts?state=open', True)
              demo_alerts = [x for x in alerts if x.get('dependency', {}).get('manifest_path', '').startswith(P)]
              record('dependabot', 'CREATED' if demo_alerts else 'TRIGGERED/GENERATED INDIRECTLY',
                     f'{len(demo_alerts)} observed demo alerts; manifest commit {sha}', 'Dependency graph / advisory matching',
                     'Only existing alerts for demo manifests counted. Alert generation is asynchronous and depends on graph/policy/advisories.')

          def sarif():
              # Synthetic result explicitly identified as a fixture, not a CodeQL scan.
              # Stable tool/category/fingerprint prevents a fresh alert on every run.
              payload = {'version': '2.1.0', '$schema': 'https://json.schemastore.org/sarif-2.1.0.json', 'runs': [{
                  'tool': {'driver': {'name': P + 'scanner', 'version': '1.0.0', 'rules': [{
                      'id': P + 'fixture', 'shortDescription': {'text': 'Harmless synthetic discovery finding'},
                      'help': {'text': 'Test metadata only. No vulnerable program is executed.'}}]}},
                  'automationDetails': {'id': P + 'analysis/'},
                  'results': [{'ruleId': P + 'fixture', 'level': 'warning',
                      'message': {'text': 'Synthetic migration discovery result; not an actual vulnerability.'},
                      'partialFingerprints': {'primaryLocationLineHash': hashlib.sha256(b'migration-demo-fixture-v1').hexdigest()},
                      'locations': [{'physicalLocation': {'artifactLocation': {'uri': P + 'content/example.txt'},
                                                        'region': {'startLine': 1}}}]}]}]}
              blob = base64.b64encode(gzip.compress(json.dumps(payload).encode(), mtime=0)).decode()
              value = api(R + '/code-scanning/sarifs', 'POST', {'commit_sha': BASE_SHA, 'ref': 'refs/heads/' + P + 'base',
                          'sarif': blob, 'checkout_uri': 'file:///migration-demo/'})
              for _ in range(18):
                  result = api(R + '/code-scanning/sarifs/' + value['id'])
                  if result.get('processing_status') == 'complete':
                      alerts = listing(R + '/code-scanning/alerts?ref=' + urllib.parse.quote('refs/heads/' + P + 'base', safe=''))
                      observed = [x for x in alerts if x.get('tool', {}).get('name') == P + 'scanner']
                      record('sarif', 'CREATED' if observed else 'TRIGGERED/GENERATED INDIRECTLY', value['id'], 'SARIF upload / processing / alert query',
                             f'Processing complete; {len(observed)} synthetic demo alerts observed.')
                      return
                  if result.get('processing_status') == 'failed':
                      raise RuntimeError('SARIF processing failed: ' + json.dumps(result.get('errors', [])))
                  time.sleep(5)
              record('sarif', 'TRIGGERED/GENERATED INDIRECTLY', value['id'], 'SARIF upload', 'Accepted; processing still pending after bounded polling.')

          def wiki():
              work = ROOT / 'wiki'
              # GitHub does not expose public API initialization of an empty wiki.
              try:
                  command(['git', 'clone', '--', SERVER + '/' + FULL + '.wiki.git', str(work)], admin=True)
              except RuntimeError as error:
                  record('wiki', 'REQUIRES EXISTING EXTERNAL ACTOR', FULL + '.wiki.git', 'Git wiki clone',
                         'Create the first wiki page in UI (and grant bootstrap token access), then rerun. ' + str(error))
                  return
              filename = P + 'Discovery.md'
              content = '# Migration discovery wiki\n\nHarmless page for [' + FULL + '](' + SERVER + '/' + FULL + ').\n'
              page = work / filename
              if not page.exists() or page.read_text() != content:
                  page.write_text(content)
                  command(['git', 'add', '--', filename], cwd=work, admin=True)
                  command(['git', '-c', 'core.hooksPath=/dev/null', '-c', 'user.name=Migration Demo',
                           '-c', 'user.email=migration-demo@example.invalid', 'commit', '-m', P + 'wiki page'], cwd=work, admin=True)
                  command(['git', 'push', 'origin', 'HEAD'], cwd=work, admin=True)
              return FULL + '.wiki.git/' + filename

          def lfs():
              name = P + 'lfs'
              if api(R + '/git/ref/heads/' + name, missing=True):
                  # Confirm pointer metadata; do not assume a similarly named branch is LFS.
                  value = api(R + '/contents/' + P + 'object.bin?ref=' + name)
                  pointer = base64.b64decode(value.get('content', '')).decode('utf-8', 'replace')
                  if not pointer.startswith('version https://git-lfs.github.com/spec/v1\n'):
                      raise RuntimeError('Existing demo LFS branch lacks expected pointer')
                  work = ROOT / 'lfs-verify'
                  command(['git', 'clone', '--no-checkout', '--single-branch', '--branch', name, '--', SERVER + '/' + FULL + '.git', str(work)])
                  command(['git', 'lfs', 'fetch', 'origin', name], cwd=work)
                  record('lfs', 'CREATED', name, 'Git LFS fetch', 'Existing remote object downloaded successfully.')
                  return name
              work = ROOT / 'lfs'
              work.mkdir(exist_ok=True)
              command(['git', 'init', '-b', name], cwd=work)
              command(['git', 'lfs', 'install', '--local'], cwd=work)
              (work / '.gitattributes').write_text(P + 'object.bin filter=lfs diff=lfs merge=lfs -text\n')
              (work / (P + 'object.bin')).write_bytes(b'Harmless migration discovery LFS fixture.\n')
              command(['git', 'add', '--', '.gitattributes', P + 'object.bin'], cwd=work)
              command(['git', '-c', 'user.name=Migration Demo', '-c', 'user.email=migration-demo@example.invalid',
                       'commit', '-m', P + 'LFS object'], cwd=work)
              command(['git', 'remote', 'add', 'origin', SERVER + '/' + FULL + '.git'], cwd=work)
              command(['git', 'push', 'origin', 'HEAD:refs/heads/' + name], cwd=work)
              return name

          def packages():
              # GHCR on github.com; GHE.com uses containers.<subdomain>.ghe.com.
              host = urllib.parse.urlparse(SERVER).hostname
              if host == 'github.com':
                  registry = 'ghcr.io'
              elif host.endswith('.ghe.com'):
                  registry = 'containers.' + host
              else:
                  raise RuntimeError('Unsupported GHE Cloud registry hostname: ' + host)
              image = registry + '/' + OWNER.lower() + '/' + ORG_NAME + '-package'
              version = 'v1'
              # Query package metadata first. GITHUB_TOKEN must have access if the
              # organization already owns a same-named package from an earlier run.
              path = O + '/packages/container/' + ORG_NAME + '-package'
              existing = api(path, missing=True)
              if existing:
                  source = existing.get('repository') or {}
                  if source.get('full_name', '').lower() != FULL.lower():
                      raise RuntimeError('Existing package is not linked to this repository; preserved')
                  versions = listing(path + '/versions')
                  if any(version in x.get('metadata', {}).get('container', {}).get('tags', []) for x in versions):
                      return image + ':' + version
              work = ROOT / 'container'
              work.mkdir(exist_ok=True)
              (work / 'message.txt').write_text('Harmless migration discovery container.\n')
              (work / 'Dockerfile').write_text('FROM scratch\nCOPY message.txt /message.txt\nLABEL org.opencontainers.image.source="' +
                  SERVER + '/' + FULL + '"\nLABEL org.opencontainers.image.description="Disposable migration discovery fixture"\n')
              # Isolated Docker credential directory removed in finally, never uploaded.
              config = ROOT / 'docker-auth'
              config.mkdir(mode=0o700, exist_ok=True)
              try:
                  command(['docker', '--config', str(config), 'login', registry, '-u', os.environ['GITHUB_ACTOR'], '--password-stdin'], stdin=TOKEN)
                  command(['docker', '--config', str(config), 'build', '--network=none', '--build-arg', 'SOURCE_DATE_EPOCH=0',
                           '-t', image + ':' + version, str(work)], timeout=300)
                  command(['docker', '--config', str(config), 'push', image + ':' + version], timeout=300)
                  command(['docker', '--config', str(config), 'manifest', 'inspect', image + ':' + version])
              finally:
                  for file in config.glob('*'):
                      if file.is_file():
                          file.unlink()
              return image + ':' + version

          def runner_inventory():
              result = api(R + '/actions/runners', admin=True)
              record('runners', 'UNSAFE/INAPPROPRIATE TO AUTOMATE', FULL, 'GET repository runners',
                     f"Observed {result['total_count']} runners. Registration tokens alone are not runner records; no persistent machine is registered.")

          def runner_group():
              path = O + '/actions/runner-groups'
              name = ORG_NAME + '-runner-group'
              old = next((x for x in listing(path, True, 'runner_groups') if x['name'] == name), None)
              if old and (old.get('inherited') or old.get('default')):
                  raise RuntimeError('Refusing to update inherited/default runner group')
              data = {'name': name, 'visibility': 'selected', 'allows_public_repositories': INFO['visibility'] == 'public',
                      'restricted_to_workflows': True, 'selected_workflows': [os.environ['GITHUB_WORKFLOW_REF']]}
              if old:
                  value = api(path + f"/{old['id']}", 'PATCH', data, admin=True)
                  api(path + f"/{old['id']}/repositories", 'PUT', {'selected_repository_ids': [INFO['id']]}, admin=True)
              else:
                  data.update(selected_repository_ids=[INFO['id']], runners=[])
                  value = api(path, 'POST', data, admin=True)
              record('runner_groups', 'CONFIGURED', name, 'Organization runner-group API',
                     'Created without machines; restricted to this repository and this workflow. Existing demo-group machines, if any, are untouched.')

          def large_runner_inventory():
              result = api(O + '/actions/hosted-runners', admin=True)
              record('large_runners', 'UNSAFE/INAPPROPRIATE TO AUTOMATE', OWNER, 'GET organization hosted-runners',
                     f"Observed {result.get('total_count', 0)} larger runners. API creation provisions billable infrastructure; skipped intentionally.")

          def installations():
              value = api(O + '/installations', admin=True)
              record('installations', 'REQUIRES EXISTING EXTERNAL ACTOR', OWNER, 'GET organization installations',
                     f"Observed {value['total_count']} existing installations. App installation requires owner consent; none created.")

          def initialize():
              for key in INVENTORY:
                  record(key, 'NOT ATTEMPTED', notes='Seeder has not reached this feature.')
              askpass = ROOT / 'askpass.sh'
              askpass.write_text('#!/bin/sh\ncase "$1" in\n*Username*) printf "%s\\n" x-access-token ;;\n*) printf "%s\\n" "$GH_TOKEN" ;;\nesac\n')
              askpass.chmod(0o700)
              record('wiki_attachments', 'API DOES NOT SUPPORT CREATION', mechanism='Wiki UI', notes='Upload wiki attachments manually; wiki Git pages are attempted separately.')
              record('secret_remediation', 'UNSAFE/INAPPROPRIATE TO AUTOMATE', mechanism='Secret scanning',
                     notes='No guaranteed inert official GitHub test pattern is assumed. No secrets committed and no existing alerts resolved. Configure scanning only.')
              record('apps', 'REQUIRES EXISTING EXTERNAL ACTOR', mechanism='App manifest / registration UI', notes='App creation/installation requires an owner consent flow; no signing keys generated.')
              record('personal_repos', 'NOT APPLICABLE TO GITHUB ENTERPRISE CLOUD SOURCE', mechanism='Organization guard', notes='Outside this organization-owned GEI discovery scope; GEC itself supports personal repositories.')
              for key in ('stars', 'watchers', 'profiles'):
                  record(key, 'REQUIRES EXISTING EXTERNAL ACTOR', mechanism='User account', notes='A consenting user must provide personal state. Workflow does not change bootstrap owner account state.')
              for key in ('ssh', 'signing', 'pats'):
                  record(key, 'UNSAFE/INAPPROPRIATE TO AUTOMATE', mechanism='User security settings', notes='Would create or modify authentication/signing material; deliberately excluded.')
              record('mannequins', 'NOT APPLICABLE TO GITHUB ENTERPRISE CLOUD SOURCE', mechanism='GEI migration output', notes='Mannequins are created by import, not by source discovery fixtures. No migration runs.')
              record('artifacts', 'NOT ATTEMPTED', mechanism='actions/upload-artifact', notes='Finalized after artifact upload step.')

          def main():
              global INFO, DEFAULT, INFO_SHA, ORG_NAME, ISSUES, BASE_SHA, FEATURE_SHA, PR, TEAM, PROTECTION, RELEASE
              initialize()
              if os.environ['DEMO_CONFIRM'] != 'YES-SEED-DEMO-DATA' or FULL != OWNER + '/' + REPO:
                  raise RuntimeError('Intentional-execution / repository identity guard failed')
              INFO = api(R)
              if INFO['owner']['type'] != 'Organization':
                  raise RuntimeError('Owner must be an organization')
              if not ADMIN:
                  REQUIRED_FAILURES.append('DEMO_ADMIN_TOKEN missing')
              DEFAULT = INFO['default_branch']
              INFO_SHA = api(R + '/git/ref/heads/' + urllib.parse.quote(DEFAULT, safe=''))['object']['sha']
              ORG_NAME = P + str(INFO['id'])
              record('repositories metadata', 'CONFIGURED', FULL, 'Existing containing repository', 'Bounded small fixtures; no size-limit stress test or large binary allocation.')
              record('workflows', 'CREATED', os.environ['GITHUB_WORKFLOW_REF'], 'This workflow file', 'workflow_dispatch only; no push triggers or recursive dispatch.')
              record('runs', 'TRIGGERED/GENERATED INDIRECTLY', SERVER + '/' + FULL + '/actions/runs/' + os.environ['GITHUB_RUN_ID'], 'Current workflow run', 'Each intentional rerun adds legitimate run history; retention is controlled by GitHub.')
              run('settings pr_settings delete_head auto_merge merge squash rebase_setting', 'Repository settings API', repo_settings)
              run('actions_settings', 'Repository Actions permission API', actions_settings)
              ISSUES = run('labels milestones issues comments issue_edits comment_links reciprocal', 'REST issue graph', seed_core, required=True)
              git_result = run('git refs', 'Git database REST APIs', seed_git, required=True)
              if not ISSUES or not git_result:
                  # Independent features still run; dependent features report dependency failures.
                  ISSUES = ISSUES or []
              BASE_SHA, FEATURE_SHA = git_result or (None, None)
              PR = run('prs pr_edits', 'REST pull requests / comments', seed_prs, required=True) if ISSUES and BASE_SHA else None
              run('pr_comments', 'COMMENT review / inline comment REST API', reviews, enabled=FULL_SEED and bool(PR))
              run('subissues', 'POST issue sub_issues', subissues, enabled=bool(ISSUES))
              run('commit_comments statuses', 'REST commit metadata', commit_metadata, enabled=bool(BASE_SHA))
              run('topics', 'REST topics', topics)
              TEAM = run('teams team_access', 'Organization teams API', teams, enabled=FULL_SEED)
              run('team_members access', 'Existing member / team membership API', team_members, enabled=FULL_SEED and bool(TEAM))
              run('collaborators', 'Existing org member collaborator API', collaborators, enabled=FULL_SEED)
              run('member_privileges', 'Organization settings API', org_settings, enabled=os.environ['DEMO_ORG_SETTINGS'] == 'true')
              run('default_branch', 'Organization read / settings UI', org_default)
              run('repo_hooks hook_secrets', 'Repository webhook API', webhook, enabled=FULL_SEED)
              run('org_hooks', 'Organization webhook API', lambda: webhook(True), enabled=FULL_SEED)
              run('autolinks', 'Repository autolinks API', autolinks, enabled=FULL_SEED)
              run('property_definitions properties', 'Organization schema / repository values API', properties, enabled=FULL_SEED)
              env = run('environments', 'Environment API', environment)
              run('env_protection', 'Environment protection APIs', env_protection, enabled=bool(env))
              run('repo_secrets', 'gh secret set (libsodium sealed box)', lambda: demo_secret('repo'))
              run('org_secrets', 'gh secret set --org (selected repository)', lambda: demo_secret('org'), enabled=FULL_SEED)
              run('dependabot_secrets', 'gh secret set --app dependabot', lambda: demo_secret('repo', 'dependabot'), enabled=FULL_SEED)
              run('codespaces', 'gh secret set --app codespaces', lambda: demo_secret('repo', 'codespaces'), enabled=FULL_SEED)
              run('org_codespaces', 'gh secret set --org --app codespaces', lambda: demo_secret('org', 'codespaces'), enabled=FULL_SEED)
              run('repo_vars', 'REST Actions variables', lambda: variable('repo'))
              run('org_vars', 'REST organization variables', lambda: variable('org'), enabled=FULL_SEED)
              run('env_secrets', 'Environment secret / variable APIs', lambda: (demo_secret('env'), variable('env')), enabled=bool(env))
              PROTECTION = run('protection last_push force', 'Branch protection REST API', protection, enabled=FULL_SEED and bool(BASE_SHA))
              run('bypass exceptions restrict_create', 'Branch protection actor options', protection_actors, enabled=bool(PROTECTION) and bool(TEAM))
              run('lock', 'Branch protection lock_branch', locked_branch, enabled=FULL_SEED and bool(BASE_SHA))
              run('required_deploy force_actors', 'GraphQL branch protection', graphql_protection, enabled=bool(PROTECTION) and bool(env))
              run('rulesets', 'Repository rulesets API', rulesets, enabled=FULL_SEED)
              run('org_rulesets', 'Organization rulesets API', lambda: rulesets(True), enabled=FULL_SEED)
              run('tag_protection', 'Current tag ruleset API', tag_ruleset, enabled=FULL_SEED)
              RELEASE = run('releases', 'Release API', release, enabled=bool(BASE_SHA) and bool(ISSUES))
              run('assets attachments', 'Release upload / issue attachment link', release_asset, enabled=bool(RELEASE))
              run('pages', 'Pages API', pages, enabled=FULL_SEED)
              run('projects', 'GraphQL Projects V2', projects, enabled=FULL_SEED and bool(ISSUES))
              run('discussions', 'GraphQL Discussions', discussions, enabled=FULL_SEED and bool(ISSUES))
              run('cross_refs', 'Private companion repository and issue APIs', cross_refs, enabled=FULL_SEED and bool(ISSUES))
              run('forks', 'Same-org fork API (no external target)', forks, enabled=FULL_SEED)
              run('mentions codeowners', 'Mentions and isolated CODEOWNERS', mentions, enabled=FULL_SEED and bool(ISSUES))
              run('rebase_links', 'PR merge API, rebase method', rebase_pr, enabled=FULL_SEED and bool(BASE_SHA) and bool(ISSUES))
              run('deployments', 'Deployment/status API', deployment, enabled=FULL_SEED and bool(BASE_SHA) and bool(env))
              run('wiki', 'Wiki Git remote', wiki, enabled=FULL_SEED)
              run('lfs', 'Git LFS object push / fetch', lfs, enabled=FULL_SEED)
              security = os.environ['DEMO_SECURITY'] == 'true'
              run('security_config', 'Code security configuration APIs', security_configuration, enabled=security)
              run('secret_config', 'Repository secret scanning API', secret_scanning, enabled=security)
              run('dependabot_config dependabot', 'Manifest + Dependabot alerts API', dependency_fixture, enabled=security)
              run('sarif', 'SARIF code scanning API', sarif, enabled=security and bool(BASE_SHA))
              run('packages', 'Docker scratch + organization container registry', packages, enabled=os.environ['DEMO_PACKAGES'] == 'true')
              run('runners', 'Runner inventory API', runner_inventory, enabled=FULL_SEED)
              run('runner_groups', 'Empty runner-group metadata API', runner_group, enabled=FULL_SEED)
              run('large_runners', 'Hosted-runner inventory API', large_runner_inventory, enabled=FULL_SEED)
              run('installations', 'Organization installations API', installations, enabled=FULL_SEED)
              record('audit activity history', 'TRIGGERED/GENERATED INDIRECTLY', FULL, 'Real API/Git mutations',
                     'Actual workflow/bot/credential attribution; no historical users or timestamps forged. Audit visibility and retention depend on enterprise policy.')
              record('search', 'TRIGGERED/GENERATED INDIRECTLY', FULL, 'GitHub indexing', 'Indexing is asynchronous; discovery fixtures do not force reindexing.')

          if __name__ == '__main__':
              try:
                  main()
              except Exception as error:
                  REQUIRED_FAILURES.append('bootstrap: ' + clean(error))
                  print('Required bootstrap failure: ' + clean(error))
              finally:
                  for key, value in list(ROWS.items()):
                      if value['status'] == 'NOT ATTEMPTED' and key != 'artifacts':
                          record(key, 'FAILED (REQUIRED)' if key in ('issues', 'git', 'prs') else 'FAILED (OPTIONAL)',
                                 notes='Not reached because a prerequisite failed; see preceding feature failures.')
                  (ROOT / 'result.json').write_text(json.dumps({'required_failures': REQUIRED_FAILURES}), encoding='utf-8')
                  save()
              sys.exit(1 if REQUIRED_FAILURES else 0)
          PY

      - name: Seed discovery data
        id: seed
        # Continue only to publish diagnostics; final step restores required failure.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DEMO_ADMIN_TOKEN: ${{ secrets.DEMO_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 "$DEMO_DIR/seed.py"

      - name: Upload coverage fixture artifact
        id: artifact
        if: ${{ always() && steps.seed.outcome != 'skipped' && steps.seed.outcome != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: migration-demo-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/migration-demo/coverage.json
            ${{ runner.temp }}/migration-demo/result.json
          if-no-files-found: error
          retention-days: 7
          # Only explicitly listed sanitized reports; never upload the working directory.

      - name: Publish final coverage and enforce required failures
        if: ${{ always() && steps.seed.outcome != 'skipped' && steps.seed.outcome != '' }}
        env:
          SEED_OUTCOME: ${{ steps.seed.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.artifact.outcome }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html
          import json
          import os
          from pathlib import Path
          root = Path(os.environ['DEMO_DIR'])
          report = root / 'coverage.json'
          rows = json.loads(report.read_text()) if report.exists() else {}
          artifact_ok = os.environ['ARTIFACT_OUTCOME'] == 'success'
          rows['artifacts'] = dict(item='Workflow artifacts', status='CREATED' if artifact_ok else 'FAILED (OPTIONAL)',
              resource=os.environ.get('ARTIFACT_URL', ''), mechanism='actions/upload-artifact',
              notes='Per-run report; seven-day retention. The uploaded JSON is the pre-upload snapshot; this summary includes the actual upload outcome.')
          def cell(value):
              return html.escape(str(value)).replace('|', '&#124;').replace('\n', '<br>')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('# Migration discovery coverage\n\n')
              summary.write('Source inventory: [GitHub Enterprise Importer documentation](https://docs.github.com/en/migrations/using-github-enterprise-importer/migrating-between-github-products/about-migrations-between-github-products), reviewed 2026-09-08.\n\n')
              summary.write('CREATED includes verified reuse; CONFIGURED describes settings. Indirect results are not proof of completed processing. HTTP 403/404 may mean permission, policy, licensing, or hidden resources; consult the recorded error. FAILED and SKIPPED are runtime outcomes, not claims of unsupported APIs.\n\n')
              summary.write('| Documentation item | Status | Demo resource | API/mechanism | Notes |\n| --- | --- | --- | --- | --- |\n')
              for value in rows.values():
                  summary.write('| ' + ' | '.join(cell(value.get(k, '')) for k in ('item', 'status', 'resource', 'mechanism', 'notes')) + ' |\n')
              if not report.exists():
                  summary.write('\nRequired failure: seeder did not produce a coverage report. Inspect step logs.\n')
              result = root / 'result.json'
              failures = json.loads(result.read_text()).get('required_failures', []) if result.exists() else ['Missing seed result']
              if failures:
                  summary.write('\nRequired failures: ' + cell(', '.join(failures)) + '\n')
          if os.environ['SEED_OUTCOME'] != 'success' or failures:
              raise SystemExit('Required seed failed; coverage report was published.')
          PY
