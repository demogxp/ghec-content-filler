              while True:
                  result = graphql('''query($owner:String!,$name:String!,$cursor:String) {
                    repository(owner:$owner,name:$name) { branchProtectionRules(first:100,after:$cursor) {
                      nodes { id pattern } pageInfo { hasNextPage endCursor }
                    } }
                  }''', {'owner': OWNER, 'name': REPO, 'cursor': cursor})['repository']['branchProtectionRules']
                  found = next((x for x in result['nodes'] if x['pattern'] == P + 'protected'), found)
                  if not result['pageInfo']['hasNextPage']:
                      break
                  cursor = result['pageInfo']['endCursor']
              if not found:
                  raise RuntimeError('Demo branch protection rule not visible in GraphQL')
              graphql('''mutation($input:UpdateBranchProtectionRuleInput!) {
                updateBranchProtectionRule(input:$input) { branchProtectionRule { id } }
              }''', {'input': {'branchProtectionRuleId': found['id'], 'requiresDeployments': True,
                              'requiredDeploymentEnvironments': [P + 'environment']}})
              record('required_deploy', 'CONFIGURED', P + 'protected', 'GraphQL updateBranchProtectionRule')
              if TEAM:
                  graphql('''mutation($input:UpdateBranchProtectionRuleInput!) {
                    updateBranchProtectionRule(input:$input) { branchProtectionRule { id } }
                  }''', {'input': {'branchProtectionRuleId': found['id'], 'allowsForcePushes': True,
                                  'bypassForcePushActorIds': [TEAM['node_id']]}})
                  record('force_actors', 'CONFIGURED', TEAM['slug'], 'GraphQL bypassForcePushActorIds')
